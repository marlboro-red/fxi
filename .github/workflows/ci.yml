name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # The integration tests compare fxi output against real ripgrep
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y

      - name: Build
        run: cargo build --all-targets

      # Clippy runs per-OS so cfg-gated code (daemon_windows.rs,
      # daemon_unix.rs) is linted natively, not just where it compiles
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Keep storage overrides unset: a forgotten fixture initializer must be
      # visible as a write to the real default app-data tree.
      - name: Snapshot real app data
        id: app-data-before
        run: |
          python -c "import os; assert not {'FXI_INDEXES', 'FXI_APP_DATA'} & os.environ.keys(), 'CI must exercise the default storage path'"
          python scripts/check-test-storage.py snapshot "${{ runner.temp }}/fxi-app-data-before.json"

      - name: Test
        env:
          FXI_DIFF_FAILURE_DIR: ${{ github.workspace }}/target/differential-failures
        run: cargo test --all-targets

      - name: Install single CLI (macOS)
        if: runner.os == 'macOS'
        run: cargo install --path . --locked --debug --root "${{ runner.temp }}/fxi-install"

      - name: Exercise installed single-binary daemon (macOS)
        if: runner.os == 'macOS'
        env:
          FXI_INSTALL_BIN: ${{ runner.temp }}/fxi-install/bin
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          binaries = Path(os.environ["FXI_INSTALL_BIN"])
          assert sorted(path.name for path in binaries.iterdir()) == ["fxi"]
          subprocess.run([binaries / "fxi", "--version"], check=True)
          with tempfile.TemporaryDirectory(prefix="fxi-install-", dir="/tmp") as temporary:
              base = Path(temporary)
              root = base / "repository"
              (root / ".git").mkdir(parents=True)
              (root / "initial.txt").write_text("installInitialMarker\n")
              env = dict(os.environ, FXI_APP_DATA=str(base / "data"),
                         FXI_INDEXES=str(base / "indexes"), FXI_SOCKET=str(base / "s.sock"))
              def run(*args):
                  return subprocess.run([binaries / "fxi", *args], cwd=root, env=env,
                                        check=True, capture_output=True, text=True)
              try:
                  run("index", "--force")
                  run("daemon", "start", "--watch")
                  run("installInitialMarker", "-l")
                  (root / "saved.txt").write_text("installLastSaveMarker\n")
                  run("daemon", "stop")
                  assert "saved.txt" in run("installLastSaveMarker", "-l").stdout
              finally:
                  run("daemon", "stop", "--force")
          PY

      - name: Verify tests left real app data unchanged
        if: always() && steps.app-data-before.outcome == 'success'
        run: python scripts/check-test-storage.py verify "${{ runner.temp }}/fxi-app-data-before.json"

      - name: Retain minimized differential failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differential-failures-${{ matrix.os }}
          path: target/differential-failures/*.json
          if-no-files-found: ignore

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  msrv:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  benchmark-harness:
    name: benchmark harness regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: python3 scripts/test_benchmarks.py
      - run: python3 scripts/test_test_storage.py

  fuzz-targets:
    name: compile bounded fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked

  extension:
    name: extension tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
